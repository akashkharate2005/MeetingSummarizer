services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meeting_summarizer
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_summarizer"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://meeting:meeting@db:5432/meeting_summarizer
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend/app:/app/app
      - ./backend/storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
